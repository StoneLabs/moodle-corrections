# Publishes the tool to GitHub Pages under /correction-tool/.
# Run it by hand: Actions → "Publish to GitHub Pages" → Run workflow.
name: Publish to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}correction-tool/
    steps:
      - uses: actions/checkout@v7

      - name: Assemble the site
        run: |
          mkdir -p _site/correction-tool
          cp correction-diff.html _site/correction-tool/index.html
          cp -r assets _site/correction-tool/
          # The site root just forwards to the tool.
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>Correction Diff</title>
          <meta http-equiv="refresh" content="0; url=correction-tool/">
          <link rel="canonical" href="correction-tool/">
          <a href="correction-tool/">Correction Diff</a>
          EOF

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
